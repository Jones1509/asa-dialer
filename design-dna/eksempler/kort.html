<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA-eksempel: Kort</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../asa-tokens.css"><link rel="stylesheet" href="_faelles.css">
<style>
/* KORT: hvid flade, 16px radius, 24px padding, navy-tonet blød skygge + 1px hårfin ring. Hover (kun klikbare kort) = let løft. */
.kort {
    background: var(--farve-hvid); border-radius: var(--radius-kort); padding: var(--trin-5);
    box-shadow: 0 6px 16px -6px rgba(14, 58, 93, .12), 0 0 0 1px rgba(14, 58, 93, .04);
}
.kort--klik { display: block; color: inherit; text-decoration: none; transition: box-shadow var(--overgang) var(--kurve), transform var(--overgang) var(--kurve); }
.kort--klik:hover { box-shadow: var(--skygge-hover); transform: translateY(-1px); }
.kort__top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--trin-3); margin-bottom: var(--trin-3); }
.kort__titel { font-size: var(--tekst-lg); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.kort__tal { font-family: var(--font-display); font-size: var(--tekst-3xl); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--farve-navy); }
.kort__tal--groen { color: var(--farve-groen); }
.kort__tekst { margin: var(--trin-2) 0 0; color: var(--farve-tekst-daempet); }
.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-pille); font-size: var(--tekst-xs); font-weight: 600; background: var(--farve-groen-lys); color: var(--farve-groen-tekst); }
.gitter { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--trin-4); }
</style></head><body>
<div class="eksempel">
  <h1>Kort</h1>
  <p class="meta">Hvid, 16 px, 24 px luft, blød navy-skygge. Store tal i navy. Ét formål pr. kort.</p>
  <div class="gitter">
    <a class="kort kort--klik" href="#"><span class="kort__tal kort__tal--groen">12</span><p class="kort__tekst">ting blev færdige i dag</p></a>
    <a class="kort kort--klik" href="#"><span class="kort__tal">3</span><p class="kort__tekst">ting er i gang</p></a>
    <div class="kort">
      <div class="kort__top"><h3 class="kort__titel">ASA Univers</h3><span class="badge">Kører</span></div>
      <p class="kort__tekst">Platformen selv: hovedappen, motoren og databasen.</p>
    </div>
  </div>
</div>
</body></html>
