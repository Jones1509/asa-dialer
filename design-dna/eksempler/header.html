<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA-eksempel: Header</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../asa-tokens.css"><link rel="stylesheet" href="_faelles.css">
<style>
body { padding: 0; }
/* HEADER (asa-el.dk): hvid, 64px, hårfin kant nederst, logo venstre, tekst-nav centreret (≥1280), ikoner/handlinger højre.
   Indhold i en container på max 1600px + 24px gutter — samme venstre-kant som resten af siden. */
.header { position: sticky; top: 0; z-index: 10; background: var(--farve-hvid); border-bottom: 1px solid var(--farve-kant); height: var(--header-hoejde); }
.header__inde { max-width: calc(var(--side-max) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); height: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--trin-4); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--farve-navy); }
.logo__maerke { width: 30px; height: 30px; border-radius: 8px; background: var(--farve-navy); color: #fff; display: grid; place-items: center; font: 700 15px var(--font-display); }
.logo__tekst { line-height: 1; font: 700 15px var(--font-display); letter-spacing: -0.01em; }
.logo__tekst small { display: block; font: 600 9px var(--font-tekst); letter-spacing: .12em; color: var(--farve-blaa); margin-top: 3px; }
.nav { display: none; justify-content: center; gap: var(--trin-1); }
@media (min-width: 1280px) { .nav { display: flex; } }
.nav a { padding: 6px 10px; border-radius: var(--radius-knap); font-size: 14px; font-weight: 500; color: var(--farve-tekst); text-decoration: none; transition: background var(--overgang); }
.nav a:hover { background: rgba(0, 0, 0, .05); }
.nav a[aria-current=page] { color: var(--farve-navy); background: var(--farve-blaa-svag); box-shadow: inset 0 -2px 0 var(--farve-blaa); }
.hoejre { display: flex; align-items: center; gap: var(--trin-3); justify-content: end; }
.pille { padding: 4px 12px; border-radius: var(--radius-pille); font-size: 13px; font-weight: 600; background: var(--farve-navy); color: #fff; }
.ikon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-knap); color: var(--farve-tekst-daempet); background: none; border: 0; }
.ikon:hover { background: rgba(0, 0, 0, .05); }
.indhold { padding: var(--trin-6) var(--gutter); max-width: calc(var(--side-max) + 2 * var(--gutter)); margin: 0 auto; }
</style></head><body>
<header class="header"><div class="header__inde">
  <a class="logo" href="#"><span class="logo__maerke">A</span><span class="logo__tekst">ASA<small>UNIVERS</small></span></a>
  <nav class="nav" aria-label="Hovedmenu"><a href="#" aria-current="page">Forside</a><a href="#">Kontrolrum</a><a href="#">Kunder</a><a href="#">Hjælp</a><a href="#">Tal og grafer</a></nav>
  <div class="hoejre"><button class="ikon" type="button" aria-label="Beskeder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button><span class="pille">Ejer</span></div>
</div></header>
<main class="indhold"><h1>Header</h1><p class="meta">Hvid · 64 px · hårfin kant · logo venstre · tekst-nav centreret fra 1280 px · ikoner og rolle til højre. Under 1280 px: bund-navigation på mobil (se repoets layout.css).</p></main>
</body></html>
